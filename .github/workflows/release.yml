name: Release

# Publie l'exe portable quand on pousse un tag vX.Y.Z (ex: git tag v0.4.0 && git push --tags).
# L'application verifie ces releases et propose la mise a jour (SHA-256 fourni automatiquement par GitHub).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build portable exe
        run: npm run dist
        env:
          # Signature de code (optionnelle): certificat .pfx encode en base64 + mot de passe, en secrets du depot.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TruckTools-*-portable.exe
          generate_release_notes: true
